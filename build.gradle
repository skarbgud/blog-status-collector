plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.blogstat'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.microsoft.playwright:playwright:1.52.0'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 크롬 확장으로 옮기기 위한 1회용 내보내기(스냅샷 → JSON). Spring을 띄우지 않고 원본 DB 파일도 열지 않는다.
tasks.register('exportJson', JavaExec) {
    group = 'application'
    description = 'H2 스냅샷을 크롬 확장 가져오기용 JSON으로 내보낸다'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.blogstat.tools.SnapshotExport'
    args = [
        project.findProperty('snapshot') ?: 'data/replica/snapshot.sql',
        project.findProperty('out') ?: 'data/export/blogstat-export.json',
    ]
}
