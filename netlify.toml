# 공유 링크 보기 페이지(Netlify). 확장 대시보드 화면만 정적 사이트로 올린다. 데이터는 올리지 않는다.
# 데이터는 공유 링크의 # 뒤에만 있고, # 뒤는 브라우저가 서버로 보내지 않는다.
[build]
  base = "extension"
  command = "npm ci && npm run build:viewer"
  publish = "viewer-dist"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    # 보기 페이지는 어디에도 요청을 보내지 않는다(connect-src 'none'). Highcharts가 인라인 style을 쓴다.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
