<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>블로그 유입 대시보드</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2430; --muted: #6b7686; --line: #e3e7ee;
    --c1: #2563eb; --c2: #16a34a; --grid: rgba(0,0,0,.08);
    --warn-bg: #fff7e0; --warn-line: #f0c36d; --warn-text: #7a4b00;
    --danger-bg: #fdecec; --danger-line: #f1a3a3; --danger-text: #8a1f1f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11151c; --card: #1a2029; --text: #e6e9ef; --muted: #9aa5b5; --line: #2a3340;
            --c1: #60a5fa; --c2: #4ade80; --grid: rgba(255,255,255,.1);
            --warn-bg: #3a2e12; --warn-line: #7a5d1c; --warn-text: #f3d28a;
            --danger-bg: #3d1a1a; --danger-line: #8a3a3a; --danger-text: #f5b1b1; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  /* ---- 3단 레이아웃: 사이드바 | 본문 | 검색어 레일 ----
     ≥1280px: 3단 / 900~1279px: 사이드바 + 본문(검색어는 본문 아래) / <900px: 상단 바 + 1단 */
  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr) 400px; gap: 20px;
            max-width: 1680px; margin: 0 auto; padding: 0 16px; align-items: start; }
  .sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; padding: 20px 0 20px;
             display: flex; flex-direction: column; gap: 18px; }
  main { min-width: 0; padding: 20px 0 48px; container-type: inline-size; }
  .rail { position: sticky; top: 16px; margin-top: 20px; min-width: 0; }
  .rail .panel { display: flex; flex-direction: column; height: calc(100vh - 32px); margin-bottom: 0; }
  .rail .scroll { flex: 1; max-height: none; }

  h1 { font-size: 17px; margin: 0; line-height: 1.3; }
  .side-label { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin: 0 0 6px; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a { display: block; padding: 6px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
  .nav a:hover { background: var(--card); }
  .nav a.active { background: var(--card); color: var(--c1); font-weight: 600; box-shadow: inset 2px 0 0 var(--c1); }
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .controls input, .controls button { font: inherit; padding: 6px 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--card); color: var(--text); width: 100%; min-width: 0; }
  .controls button { cursor: pointer; }
  .controls button.active { border-color: var(--c1); color: var(--c1); }
  .controls .range-sep { text-align: center; color: var(--muted); font-size: 12px; line-height: 1; }
  #apply { background: var(--c1); border-color: var(--c1); color: #fff; }
  .status { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
  .status .row { display: flex; justify-content: space-between; gap: 8px; }
  .status .row span:first-child { color: var(--muted); }
  .status .ok { color: var(--c2); }
  .status .warn { color: var(--warn-text); }
  .status .danger { color: var(--danger-text); }

  @media (max-width: 1279px) {
    .layout { grid-template-columns: 220px minmax(0, 1fr); }
    /* 사이드바가 두 줄(본문, 검색어)에 걸치게 해서, 사이드바 높이가 첫 줄 높이를 늘리지 않게 한다 */
    .sidebar { grid-row: 1 / span 2; }
    .rail { grid-column: 2; position: static; margin-top: 0; padding-bottom: 48px; }
    .rail .panel { height: auto; }
    .rail .scroll { max-height: 520px; }
    main { padding-bottom: 0; }
  }
  @media (max-width: 899px) {
    .layout { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .sidebar { position: static; max-height: none; padding-bottom: 0; gap: 12px; grid-row: auto; }
    .rail { grid-column: 1; }
    .nav { flex-direction: row; flex-wrap: wrap; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; }
    .controls .presets, .controls #apply { grid-column: 1 / -1; }
    .controls .range-sep { display: none; }
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card .label { color: var(--muted); font-size: 12px; }
  .card .value { font-size: 24px; font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 15px; margin: 0 0 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  /* 화면 폭이 아니라 본문 폭 기준: 3단일 때 본문이 좁아지면 도넛과 순위를 세로로 쌓는다 */
  @container (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
  .chart-box { position: relative; height: 280px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:not(:first-child), td:not(:first-child) { text-align: right; }
  th { white-space: nowrap; }
  .badges { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; vertical-align: middle; }
  .badge.more { color: var(--muted); border-color: var(--line); }
  .badge { display: inline-block; margin-left: 0; padding: 0 7px; border-radius: 999px; font-size: 11px;
           line-height: 18px; color: var(--c1); border: 1px solid var(--c1); white-space: nowrap; font-weight: 400; }
  .tag { font-size: 11px; color: var(--c2); margin-left: 6px; }
  #msg { color: var(--muted); margin: 8px 0; }
  .panel h2 .sub { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  #q-filter { width: 100%; font: inherit; padding: 6px 10px; margin-bottom: 8px; border: 1px solid var(--line);
         border-radius: 6px; background: var(--card); color: var(--text); }
  .scroll { max-height: 520px; overflow: auto; border-top: 1px solid var(--line); }
  .scroll thead th { position: sticky; top: 0; background: var(--card); }
  .qtable th:nth-child(2), .qtable td:nth-child(2),
  .qtable th:nth-child(5), .qtable td:nth-child(5) { text-align: left; }
  .qtable td:nth-child(2) { word-break: break-word; }
  .qtable td:nth-child(5), .qtable td:first-child { color: var(--muted); font-size: 12px; }
  /* 레일(400px)에서는 순번·유입처 열을 숨긴다. 유입처는 행에 마우스를 올리면 툴팁으로 보인다 */
  @media (min-width: 1280px) {
    .qtable th:nth-child(1), .qtable td:nth-child(1),
    .qtable th:nth-child(5), .qtable td:nth-child(5) { display: none; }
  }
  .banner { border: 1px solid; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-text); }
  .banner.danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger-text); }
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <h1>블로그 유입<br>대시보드</h1>

  <nav class="nav" aria-label="페이지">
    <a href="#overview" class="active">개요</a>
    <a href="#queries-panel">검색어</a>
  </nav>

  <div>
    <p class="side-label">기간</p>
    <div class="controls">
      <div class="presets">
        <button data-days="7">7일</button>
        <button data-days="30" class="active">30일</button>
        <button data-days="90">90일</button>
      </div>
      <input type="date" id="from" aria-label="시작일">
      <div class="range-sep">~</div>
      <input type="date" id="to" aria-label="종료일">
      <button id="apply">조회</button>
    </div>
  </div>

  <div>
    <p class="side-label">상태</p>
    <div class="status">
      <div class="row"><span>최근 수집일</span><span id="s-latest">-</span></div>
      <div class="row"><span>로그인 세션</span><span id="s-session">-</span></div>
    </div>
  </div>
</aside>

<main id="overview">
  <div id="session-banner" class="banner" role="alert" hidden></div>
  <div id="msg"></div>

  <div class="cards">
    <div class="card"><div class="label">총 방문</div><div class="value" id="c-total">-</div></div>
    <div class="card"><div class="label">검색 유입</div><div class="value" id="c-search">-</div></div>
    <div class="card"><div class="label">검색 비율</div><div class="value" id="c-ratio">-</div></div>
    <div class="card"><div class="label">수집된 날짜</div><div class="value" id="c-days">-</div></div>
  </div>

  <div class="panel">
    <h2>일별 방문 추이</h2>
    <div class="chart-box"><canvas id="daily"></canvas></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>유입처 비율 (상위 10)</h2>
      <div class="chart-box"><canvas id="share"></canvas></div>
    </div>
    <div class="panel">
      <h2>유입처 순위</h2>
      <table>
        <thead><tr><th>유입처</th><th>방문</th><th>비율</th></tr></thead>
        <tbody id="rank"></tbody>
      </table>
    </div>
  </div>
</main>

<aside class="rail">
  <div class="panel" id="queries-panel">
    <h2>검색어 전체<span class="sub" id="q-count"></span></h2>
    <input type="search" id="q-filter" placeholder="검색어 필터 (예: 팝업)" autocomplete="off">
    <div class="scroll">
      <table class="qtable">
        <thead><tr><th>#</th><th>검색어</th><th>방문</th><th>일수</th><th>유입처</th></tr></thead>
        <tbody id="queries"></tbody>
      </table>
    </div>
  </div>
</aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const nf = new Intl.NumberFormat('ko-KR');
  let dailyChart = null, shareChart = null;

  function iso(d) {
    const p = (n) => String(n).padStart(2, '0');
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  async function get(path, params) {
    const qs = new URLSearchParams(params).toString();
    const res = await fetch(path + '?' + qs);
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.json()).message || ''; } catch (e) { /* 본문 없음 */ }
      throw new Error(detail || ('HTTP ' + res.status));
    }
    return res.json();
  }

  function render(summary, daily, referrers) {
    $('from').value = summary.from;
    $('to').value = summary.to;
    $('c-total').textContent = nf.format(summary.totalVisits);
    $('c-search').textContent = nf.format(summary.searchVisits);
    $('c-ratio').textContent = summary.searchRatio.toFixed(1) + '%';
    $('c-days').textContent = summary.collectedDays + ' / ' + summary.totalDays + '일';

    const c1 = css('--c1'), c2 = css('--c2'), grid = css('--grid'), muted = css('--muted');
    if (dailyChart) dailyChart.destroy();
    dailyChart = new Chart($('daily'), {
      type: 'line',
      data: {
        labels: daily.map((d) => d.date.slice(5)),
        datasets: [
          { label: '전체', data: daily.map((d) => d.visits), borderColor: c1, backgroundColor: c1,
            tension: .25, spanGaps: false, pointRadius: 2 },
          { label: '검색', data: daily.map((d) => d.searchVisits), borderColor: c2, backgroundColor: c2,
            tension: .25, spanGaps: false, pointRadius: 2 },
        ],
      },
      options: {
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { color: grid }, ticks: { color: muted, maxTicksLimit: 10 } },
          y: { beginAtZero: true, grid: { color: grid }, ticks: { color: muted } },
        },
        plugins: { legend: { labels: { color: muted } } },
      },
    });

    const palette = ['#2563eb', '#16a34a', '#d97706', '#9333ea', '#dc2626',
                     '#0891b2', '#65a30d', '#db2777', '#4b5563', '#ca8a04'];
    if (shareChart) shareChart.destroy();
    shareChart = new Chart($('share'), {
      type: 'doughnut',
      data: {
        labels: referrers.map((r) => r.name),
        datasets: [{ data: referrers.map((r) => r.visits), backgroundColor: palette, borderWidth: 0 }],
      },
      options: { maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { color: muted } } } },
    });

    // 유입처 이름은 외부 값이므로 innerHTML을 쓰지 않고 textContent로만 넣는다.
    const body = $('rank');
    body.replaceChildren();
    for (const r of referrers) {
      const tr = document.createElement('tr');
      const name = document.createElement('td');
      name.textContent = r.name;
      if (r.searchEngine) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = '검색';
        name.appendChild(tag);
      }
      const v = document.createElement('td');
      v.textContent = nf.format(r.visits);
      const p = document.createElement('td');
      p.textContent = r.ratio.toFixed(1) + '%';
      tr.append(name, v, p);
      body.appendChild(tr);
    }
  }

  // 검색어는 외부(검색 사용자) 입력이므로 innerHTML을 쓰지 않고 textContent로만 넣는다.
  let allQueries = [];

  // 검색어가 실제로 들어온 날짜마다 뱃지를 하나씩 붙인다('MM/DD').
  // 날짜가 많으면 최근 MAX_BADGES개만 보이고, 나머지는 '+N' 뱃지 툴팁으로 보여준다.
  const MAX_BADGES = 7;
  function dateBadges(dates) {
    const wrap = document.createElement('span');
    wrap.className = 'badges';
    if (!dates || dates.length === 0) return wrap;
    const md = (d) => d.slice(5).replace('-', '/');
    const hidden = dates.length > MAX_BADGES ? dates.slice(0, dates.length - MAX_BADGES) : [];
    const shown = dates.slice(hidden.length);
    if (hidden.length > 0) {
      const more = document.createElement('span');
      more.className = 'badge more';
      more.textContent = '+' + hidden.length;
      more.title = hidden.join(', ');
      wrap.appendChild(more);
    }
    for (const d of shown) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = md(d);
      badge.title = d;
      wrap.appendChild(badge);
    }
    return wrap;
  }

  function renderQueries(report) {
    allQueries = report.items;
    $('q-count').textContent = '서로 다른 검색어 ' + nf.format(report.distinctQueries) + '개 · 방문 '
      + nf.format(report.totalVisits) + '회'
      + (report.truncated ? ' · 상위 ' + nf.format(report.items.length) + '개만 표시' : '');
    drawQueries();
  }

  function drawQueries() {
    const kw = $('q-filter').value.trim().toLowerCase();
    const rows = kw ? allQueries.filter((q) => q.query.toLowerCase().includes(kw)) : allQueries;
    const body = $('queries');
    body.replaceChildren();
    if (rows.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 5;
      td.style.textAlign = 'left';
      td.textContent = allQueries.length === 0 ? '이 기간에 수집된 검색어가 없습니다.' : '일치하는 검색어가 없습니다.';
      tr.appendChild(td);
      body.appendChild(tr);
      return;
    }
    rows.forEach((q, i) => {
      const tr = document.createElement('tr');
      tr.title = '유입처: ' + q.sources.join(', '); // 레일에서 숨긴 유입처 열 대신
      const cells = [String(i + 1), q.query, nf.format(q.visits), String(q.days), q.sources.join(', ')];
      cells.forEach((text, col) => {
        const td = document.createElement('td');
        td.textContent = text;
        if (col === 1) td.appendChild(dateBadges(q.dates));
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }

  async function load(params) {
    $('msg').textContent = '불러오는 중…';
    try {
      const summary = await get('/api/dashboard/summary', params);
      const range = { from: summary.from, to: summary.to };
      const [daily, referrers, queries] = await Promise.all([
        get('/api/dashboard/daily', range),
        get('/api/dashboard/referrers', Object.assign({ limit: 10 }, range)),
        get('/api/dashboard/queries', Object.assign({ limit: 1000 }, range)),
      ]);
      render(summary, daily, referrers);
      renderQueries(queries);
      $('s-latest').textContent = summary.latestDate || '없음';
      $('msg').textContent = summary.collectedDays === 0 ? '이 기간에 수집된 데이터가 없습니다.' : '';
    } catch (e) {
      $('msg').textContent = '조회 실패: ' + e.message;
    }
  }

  // 로그인 쿠키 만료 경고. 문구는 서버가 만든 값이지만 innerHTML 없이 textContent로만 넣는다.
  async function loadSession() {
    const banner = $('session-banner');
    const side = $('s-session');
    try {
      const s = await get('/api/dashboard/session', {});
      const level = s.state === 'OK' ? 'ok' : (s.state === 'EXPIRED' || s.state === 'MISSING' ? 'danger' : 'warn');
      side.textContent = s.daysLeft == null ? (s.state === 'OK' ? '정상' : '확인 필요')
        : (s.daysLeft < 0 ? '만료' : 'D-' + s.daysLeft);
      side.className = level;
      side.title = s.message || '';
      if (s.state === 'OK') {
        banner.hidden = true;
        return;
      }
      banner.textContent = s.message;
      banner.className = 'banner ' + level;
      banner.hidden = false;
    } catch (e) {
      banner.hidden = true; // 경고를 못 가져와도 대시보드 본문은 계속 보여 준다.
      side.textContent = '-';
    }
  }

  function setActive(btn) {
    document.querySelectorAll('[data-days]').forEach((b) => b.classList.toggle('active', b === btn));
  }

  document.querySelectorAll('[data-days]').forEach((b) => b.addEventListener('click', async () => {
    setActive(b);
    // 기준일은 서버가 정한 최근 저장일이다(오늘 기준이 아님). to만 비우고 from을 맞춘다.
    const latest = (await get('/api/dashboard/summary', {})).to;
    const to = new Date(latest + 'T00:00:00');
    const from = new Date(to);
    from.setDate(from.getDate() - (Number(b.dataset.days) - 1));
    load({ from: iso(from), to: latest });
  }));

  $('apply').addEventListener('click', () => {
    setActive(null);
    const params = {};
    if ($('from').value) params.from = $('from').value;
    if ($('to').value) params.to = $('to').value;
    load(params);
  });

  $('q-filter').addEventListener('input', drawQueries);

  loadSession();
  load({});
})();
</script>
</body>
</html>
