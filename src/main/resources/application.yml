spring:
  main:
    # 현재는 CLI 러너만 사용. 대시보드 단계에서 제거
    web-application-type: none
  datasource:
    # 쓰기 프로세스(collect/schedule/login)만 이 파일을 연다. H2 파일 DB는 한 프로세스만 열 수 있다.
    # AUTO_SERVER는 쓰지 않는다: sa/빈 비밀번호로 DB TCP 포트가 모든 인터페이스에 열려 개인 통계가 노출된다.
    # 대시보드(읽기)는 이 파일을 열지 않고 아래 스냅샷을 읽는다(application-dashboard.yml 참고).
    url: jdbc:h2:file:./data/blogstat
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # 쉬는 동안 연결을 모두 닫아 H2 파일 잠금을 푼다(마지막 연결이 닫히면 H2가 DB를 닫는다).
      # 그래서 상주하는 스케줄러가 수집하지 않는 동안에는 collect-queries 같은 다른 쓰기 프로세스가 DB를 열 수 있다.
      # Hikari 하우스키퍼가 30초마다 돌므로, 수집이 끝나고 잠금이 풀리기까지 최대 약 40초 걸린다.
      minimum-idle: 0
      idle-timeout: 10000
      max-lifetime: 60000
  jpa:
    hibernate:
      ddl-auto: update

app:
  mode: none
  profile-dir: .playwright-profile
  stat-url: https://blog.stat.naver.com/m/blog/daily/referer
  replica:
    # 쓰기 쪽이 내보내고 대시보드가 읽는 스냅샷 파일(개인 통계라 data/ 아래, gitignore 대상)
    file: ./data/replica/snapshot.sql
  queries:
    # 검색어만 따로 수집(--app.mode=collect-queries)할 때 기본으로 거슬러 올라갈 일수
    default-days: 30
  metrics:
    # 지표 수집(--app.mode=collect-metrics)에서 기본으로 거슬러 올라갈 일수
    default-days: 30
    # 지표 수집 한 회차의 최대 요청 수(재시도 포함). 처음 30일치를 다 받으면 시계열 약 20회 + 하루 단위 30일 약 210회
    # + 게시글별(순위에 나온 게시글 수 x 2)이라 440회 안팎이라 기본 예산(200)보다 크다. 이후 매일 수집은 100회 안팎이다.
    max-requests-per-run: 600
  session:
    # 로그인 쿠키 만료까지 이 일수 이하로 남으면 경고(로그, 대시보드 배너)
    warn-days: 7
  schedule:
    # 매일 03:10(KST). 전날 통계가 확정된 뒤에 수집한다.
    cron: "0 10 3 * * *"
    # 한 회차에 보충할 최대 일수
    max-catchup-days: 7
    # 앱 시작 직후에도 한 번 실행(PC가 꺼져 있던 날 보충)
    run-on-start: true
  collect:
    base-url: https://blog.stat.naver.com
    # 요청 사이 지연(저빈도 수집). 회차의 첫 요청을 빼고 모든 요청 앞에 적용된다.
    min-delay-ms: 2000
    max-delay-ms: 5000
    # 타임아웃/429/5xx 재시도: 지수 백오프 + 풀 지터
    max-retries: 3
    base-backoff-ms: 1000
    cap-backoff-ms: 30000
    request-timeout-ms: 10000
    headless: true
    # 검색 유입처 하나당 가져올 검색어 최대 개수(화면은 20을 쓴다)
    query-size: 100
    # 한 회차(실행 한 번)의 최대 요청 수(재시도 포함). 넘으면 멈추고 남은 날짜는 다음 회차에 보충한다.
    # 유입경로는 하루에 1 + 검색 유입처 수(현재 3~4)회라, 30일 검색어 보충(약 120회)도 한 회차에 들어간다.
    max-requests-per-run: 200
  explore:
    output-dir: explore-output
    # 로그인 완료까지 최대 대기(초)
    login-timeout-sec: 300
    # 첫 캡처 후 날짜를 직접 바꿔 볼 수 있는 추가 관찰 시간(초)
    extra-observe-sec: 90
