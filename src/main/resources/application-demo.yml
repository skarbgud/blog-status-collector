# 시연 프로필: `--spring.profiles.active=demo`  (scripts\demo.cmd)
#
# 인메모리 H2에 가짜 통계(DemoDataSeeder)를 넣고 대시보드를 띄운다.
# 실제 DB 파일(./data), 로그인 쿠키, 네이버를 건드리지 않는다. 그래서 시연 중에
#  - H2 파일 잠금 충돌이 없고(수집기가 돌고 있어도 된다)
#  - 세션 만료로 화면이 깨지지 않고
#  - 개인 통계나 실제 검색어가 화면에 나오지 않는다.
spring:
  main:
    web-application-type: servlet
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
server:
  address: 127.0.0.1
  port: 8080
  error:
    include-message: always
